# Render Blueprint — FinancePilot AI Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: financepilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ANALYSIS_PROVIDER
        value: groq
      - key: DART_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
