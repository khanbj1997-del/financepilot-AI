# Render Free tier: 15분 무요청 시 슬립 → 외부에서 10분마다 ping
# 주의: 24시간 keep-alive 시 월 ~720시간 사용 (무료 한도 750시간)
name: Keep Render Awake

on:
  schedule:
    # 매 10분 (UTC). GitHub cron은 몇 분 지연될 수 있음
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health
        run: |
          set -e
          URL="${{ secrets.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://financepilot-ai-2.onrender.com/health"
          fi
          echo "Pinging $URL"
          curl -fsS --max-time 90 "$URL" | tee /tmp/health.json
          echo
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/health.json"))
          print("status=", data.get("status"))
          print("analysis_provider=", data.get("analysis_provider"))
          print("groq_key_set=", data.get("groq_key_set"))
          PY
